<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Edit Activity - Timetrack', ~{::div})}">
<body>
<div class="max-w-4xl mx-auto">
    <div class="mb-8 flex items-center gap-4">
        <a th:href="@{/activities}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accentForeground h-10 w-10 text-mutedForeground">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-3xl font-bold tracking-tight">Edit Activity</h1>
            <p class="text-mutedForeground mt-1">Update your activity details.</p>
        </div>
    </div>

    <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm max-w-2xl mx-auto">
        <form th:action="@{'/activities/' + ${activity.id}}" th:object="${activity}" th:method="put" class="p-6 space-y-6">
            
            <div class="space-y-2">
                <label for="name" class="text-sm font-medium leading-none">Activity Name</label>
                <input type="text" id="name" name="name" th:field="*{name}" required class="flex h-10 w-full rounded-md border border-border bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-mutedForeground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
            </div>

            <div class="space-y-2">
                <label for="description" class="text-sm font-medium leading-none">Description</label>
                <input type="text" id="description" name="description" th:field="*{description}" class="flex h-10 w-full rounded-md border border-border bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-mutedForeground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="time" class="text-sm font-medium leading-none">Goal/Max Time (hh:mm)</label>
                    <input type="time" id="time" name="time" th:field="*{time}" class="flex h-10 w-full rounded-md border border-border bg-background px-3 py-2 text-sm ring-offset-background text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" onclick="this.showPicker()">
                </div>

                <div class="space-y-2">
                    <label for="activityType" class="text-sm font-medium leading-none">Type</label>
                    <select id="activityType" name="activityType" th:field="*{activityType}" class="flex h-10 w-full items-center justify-between rounded-md border border-border bg-background px-3 py-2 text-sm ring-offset-background focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                        <option value="GOAL">Goal (Minimum Time)</option>
                        <option value="MAX_TIME">Max Time (Limit)</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <label for="categoryName" class="text-sm font-medium leading-none">Category</label>
                <input id="categoryName" name="categoryName" list="categories" th:value="*{category?.name}" placeholder="Select or type a new category" autocomplete="off" class="flex h-10 w-full rounded-md border border-border bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-mutedForeground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                <datalist id="categories">
                    <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}"></option>
                </datalist>
            </div>

            <div class="flex items-center gap-4 pt-4 border-t border-border">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-primary text-primaryForeground hover:bg-primary/90 h-10 px-4 py-2">
                    Save Changes
                </button>
                <a th:href="@{/activities}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-border bg-transparent hover:bg-accent hover:text-accentForeground h-10 px-4 py-2">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
