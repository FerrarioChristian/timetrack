<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Activity</title>
</head>
<body>
<h1>Edit Activity</h1>
<form th:action="@{'/activities/' + ${activity.id}}" th:object="${activity}" th:method="put">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" th:field="*{name}" required>

    <label for="description">Description</label>
    <input type="text" id="description" name="description" th:field="*{description}">

    <label for="activityType">Type</label>
    <select id="activityType" name="activityType" th:field="*{activityType}">
        <option value="GOAL">Goal</option>
        <option value="MAX_TIME">Max Time</option>
    </select>

    <label for="categoryName">Category</label>
    <input id="categoryName" name="categoryName" list="categories" th:value="*{category.name}" placeholder="Select or add category">
    <datalist id="categories">
        <option th:each="category : ${categories}" th:value="${category.name}" th:text="${category.name}">
        </option>
    </datalist>

    <button type="submit">Save Changes</button>
</form>
</body>
</html>
