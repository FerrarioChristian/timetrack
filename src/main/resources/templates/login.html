<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/styles/new-edit.css}" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/styles/main.css}" rel="stylesheet"/>
    <title>Login - Time Tracker</title>
</head>
<body>
    <h1>Login</h1>
    <div class="container">
        <form class="mt-4 flex flex-column gap-4 w-75 m-auto" th:action="@{/login}" method="post">
            <label for="username">
                Username
                <input id="username" type="email" name="username" placeholder="Username" class="form-control">
            </label>
            <label for="password">
                Password
                <input id="password" type="password" name="password" placeholder="Password" class="form-control">
            </label>

            <p th:if="${param.error}" class="text-danger m-0" >Invalid credentials.</p>
            <p th:if="${param.logout}" class="text-danger m-0" >You've been logged out.</p>

            <button type="submit" class="btn btn-primary">Login</button>
            <a th:href="@{'/register'}" class="btn btn-outline-primary">Register</a>
        </form>
    </div>
</body>
</html>
