<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Activity Details - Timetrack', ~{::div})}">
<body>
<div>
    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <a th:href="@{/activities}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accentForeground h-10 w-10 text-mutedForeground">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-3xl font-bold tracking-tight" th:text="${activity.name}">Activity Name</h1>
                <p class="text-mutedForeground mt-1" th:text="${activity.description != null and !activity.description.isEmpty() ? activity.description : 'No description'}"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <form th:if="${!activity.hasActiveSession()}" th:action="@{'/sessions/' + ${activity.id} + '/start'}" method="post">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-primary text-primaryForeground hover:bg-primary/90 h-9 px-4 gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    Start
                </button>
            </form>
            <form th:if="${activity.hasActiveSession()}" th:action="@{'/sessions/' + ${activity.id} + '/stop'}" method="post">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-destructive text-destructiveForeground hover:bg-destructive/90 h-9 px-4 gap-2">
                    <i data-lucide="square" class="w-4 h-4 text-current fill-current"></i>
                    Stop
                </button>
            </form>
            <a th:href="@{'/activities/' + ${activity.id} + '/edit'}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-border bg-transparent hover:bg-accent hover:text-accentForeground h-9 px-4 gap-2">
                <i data-lucide="pencil" class="w-4 h-4"></i>
                Edit
            </a>
            <form th:action="@{'/activities/' + ${activity.id}}" th:method="delete" onsubmit="return confirm('Are you sure you want to delete this activity?');">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-destructive/30 text-destructive hover:bg-destructive hover:text-destructiveForeground h-9 px-4 gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    Delete
                </button>
            </form>
        </div>
    </div>

    <!-- Info Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm p-6 flex items-center gap-4">
            <div class="bg-accent rounded-full p-3">
                <i data-lucide="tag" class="w-5 h-5 text-mutedForeground"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-mutedForeground">Category</p>
                <p class="font-semibold" th:text="${activity.category != null ? activity.category.name : 'None'}"></p>
            </div>
        </div>
        <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm p-6 flex items-center gap-4">
            <div class="bg-accent rounded-full p-3">
                <i data-lucide="target" class="w-5 h-5 text-mutedForeground"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-mutedForeground">Type</p>
                <p class="font-semibold" th:text="${activity.activityType}"></p>
            </div>
        </div>
        <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm p-6 flex items-center gap-4">
            <div class="bg-accent rounded-full p-3">
                <i data-lucide="clock" class="w-5 h-5 text-mutedForeground"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-mutedForeground">Goal/Limit</p>
                <p class="font-semibold" th:text="${activity.time != null ? activity.getTimeString() : 'Not set'}"></p>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <h2 class="text-xl font-semibold tracking-tight mb-4">Statistics</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm p-6">
            <h3 class="font-medium text-lg mb-4 flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4 text-mutedForeground"></i> Last Week</h3>
            <div class="space-y-3">
                <div class="flex justify-between border-b border-border pb-2">
                    <span class="text-mutedForeground">Session Average</span>
                    <span class="font-medium" th:text="${@durationFormatter.print(stats.sessionAverageLastWeek, null)}"></span>
                </div>
                <div class="flex justify-between border-b border-border pb-2">
                    <span class="text-mutedForeground">Daily Average</span>
                    <span class="font-medium" th:text="${@durationFormatter.print(stats.dailyAverageLastWeek, null)}"></span>
                </div>
                <div class="flex justify-between pb-1">
                    <span class="text-mutedForeground">Total Time</span>
                    <span class="font-medium" th:text="${@durationFormatter.print(stats.totalTimeLastWeek, null)}"></span>
                </div>
            </div>
        </div>

        <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm p-6">
            <h3 class="font-medium text-lg mb-4 flex items-center gap-2"><i data-lucide="calendar-check" class="w-4 h-4 text-mutedForeground"></i> Last Month</h3>
            <div class="space-y-3">
                <div class="flex justify-between border-b border-border pb-2">
                    <span class="text-mutedForeground">Session Average</span>
                    <span class="font-medium" th:text="${@durationFormatter.print(stats.sessionAverageLastMonth, null)}"></span>
                </div>
                <div class="flex justify-between border-b border-border pb-2">
                    <span class="text-mutedForeground">Daily Average</span>
                    <span class="font-medium" th:text="${@durationFormatter.print(stats.dailyAverageLastMonth, null)}"></span>
                </div>
                <div class="flex justify-between pb-1">
                    <span class="text-mutedForeground">Total Time</span>
                    <span class="font-medium" th:text="${@durationFormatter.print(stats.totalTimeLastMonth, null)}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sessions Table -->
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold tracking-tight">Activity Sessions</h2>
        <button type="button" onclick="openManualModal()" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-secondary text-secondaryForeground hover:bg-secondary/80 h-9 px-4 gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Add Session
        </button>
    </div>
    <div class="rounded-xl border border-border bg-card text-cardForeground shadow-sm overflow-hidden mb-8">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-mutedForeground bg-accent/50 border-b border-border">
                    <tr>
                        <th scope="col" class="px-6 py-3 font-medium">#</th>
                        <th scope="col" class="px-6 py-3 font-medium">Start Time</th>
                        <th scope="col" class="px-6 py-3 font-medium">End Time</th>
                        <th scope="col" class="px-6 py-3 font-medium text-right">Duration</th>
                        <th scope="col" class="px-6 py-3 font-medium text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${activity.sessions.isEmpty()}">
                        <td colspan="4" class="px-6 py-8 text-center text-mutedForeground">No sessions recorded yet.</td>
                    </tr>
                    <tr th:each="activitySession : ${activity.sessions}" class="border-b border-border hover:bg-accent/30 transition-colors last:border-0">
                        <td class="px-6 py-4" th:text="${activitySessionStat.index+1}"></td>
                        <td class="px-6 py-4" th:text="${#temporals.format(activitySession.startTime, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td class="px-6 py-4" th:text="${activitySession.endTime != null ? #temporals.format(activitySession.endTime, 'dd/MM/yyyy HH:mm:ss') : 'Ongoing...'}"></td>
                        <td class="px-6 py-4 text-right font-medium" th:classappend="${activitySession.endTime == null ? 'text-green-500' : ''}" th:text="${activitySession.endTime != null ? @durationFormatter.print(activitySession.getDuration(), null) : 'In progress'}"></td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2" th:if="${activitySession.endTime != null}">
                                <button type="button" th:data-id="${activitySession.id}" th:data-start="${activitySession.startTime}" th:data-end="${activitySession.endTime}" onclick="openEditModal(this.getAttribute('data-id'), this.getAttribute('data-start'), this.getAttribute('data-end'))" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accentForeground h-8 w-8 text-mutedForeground">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </button>
                                <form th:action="@{'/sessions/delete/' + ${activitySession.id}}" th:method="delete" onsubmit="return confirm('Delete this session?');">
                                    <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-destructive hover:text-destructiveForeground h-8 w-8 text-mutedForeground">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<!-- Manual Session Modal -->
<div id="manualSessionModal" class="fixed inset-0 z-50 bg-background/80 backdrop-blur-sm hidden flex items-center justify-center">
    <div class="bg-card text-cardForeground border border-border shadow-lg rounded-xl max-w-md w-full p-6">
        <h2 id="manualModalTitle" class="text-xl font-bold tracking-tight mb-4">Add Session</h2>
        
        <form id="manualSessionForm" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <input type="hidden" name="_method" id="manualSessionMethod" value="post">
            
            <div class="space-y-4">
                <div class="grid gap-2">
                    <label for="startTime" class="text-sm font-medium leading-none">Start Time</label>
                    <input type="datetime-local" id="startTime" name="startTime" required
                           class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
                </div>
                
                <div class="grid gap-2">
                    <label for="endTime" class="text-sm font-medium leading-none">End Time</label>
                    <input type="datetime-local" id="endTime" name="endTime"
                           class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
                </div>
            </div>
            
            <div class="flex gap-4 mt-6">
                <button type="button" onclick="closeManualModal()" class="flex-1 inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-border bg-transparent hover:bg-accent hover:text-accentForeground h-10 px-4 py-2">
                    Cancel
                </button>
                <button type="submit" class="flex-1 inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-primary text-primaryForeground hover:bg-primary/90 h-10 px-4 py-2">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const activityId = /*[[${activity.id}]]*/ null;
    
    function openManualModal() {
        document.getElementById('manualModalTitle').textContent = 'Add Session';
        document.getElementById('manualSessionMethod').value = 'post';
        document.getElementById('manualSessionForm').action = '/sessions/' + activityId + '/manual';
        
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        
        const end = now.toISOString().slice(0, 16);
        
        const start = new Date(now.getTime() - (60 * 60 * 1000));
        
        document.getElementById('startTime').value = start.toISOString().slice(0, 16);
        document.getElementById('endTime').value = end;
        
        document.getElementById('manualSessionModal').classList.remove('hidden');
    }
    
    function openEditModal(sessionId, startStr, endStr) {
        document.getElementById('manualModalTitle').textContent = 'Edit Session';
        document.getElementById('manualSessionMethod').value = 'put';
        document.getElementById('manualSessionForm').action = '/sessions/edit/' + sessionId;
        
        if (startStr && startStr.length >= 16) {
            document.getElementById('startTime').value = startStr.substring(0, 16);
        }
        
        if (endStr && endStr !== 'null' && endStr.length >= 16) {
            document.getElementById('endTime').value = endStr.substring(0, 16);
        } else {
            document.getElementById('endTime').value = '';
        }
        
        document.getElementById('manualSessionModal').classList.remove('hidden');
    }
    
    function closeManualModal() {
        document.getElementById('manualSessionModal').classList.add('hidden');
    }
    /*]]>*/
</script>
</div>
</body>
</html>
