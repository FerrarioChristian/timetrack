<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/styles/new-edit.css}" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/styles/main.css}" rel="stylesheet"/>
    <title>Time Tracker</title>
</head>
<body>
<h1 th:text="${activity.name}" class="mb-2"></h1>
    <div class="container">
            <form th:action="@{'/activities/' + ${activity.id}}" th:object="${activity}" th:method="post" class="mb-4">
                <p><strong>Description:</strong> <span th:text="*{description}"></span></p>
                <p><strong>Category:</strong> <span th:text="*{category?.name}"></span></p>
                <p><strong>Goal Time:</strong> <span th:text="*{activity.time}"></span></p>
                <p><strong>Type:</strong> <span th:text="${activity.activityType}"></span></p>
                <div class="flex">
                    <a th:href="@{'/'}" class="btn btn-secondary me-2">Back</a>
                    <a th:href="@{'/activities/' + ${activity.id} + '/edit'}" class="btn btn-primary">Edit</a>
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" class="btn btn-danger ml-auto">Delete</button>
                </div>
            </form>

        <h2>Activity Sessions</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="activitySession : ${sessions}">
                    <td th:text="${#temporals.format(activitySession.startTime, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td th:text="${activitySession.endTime != null ? #temporals.format(activitySession.endTime, 'dd/MM/yyyy HH:mm:ss') : 'Ongoing'}"></td>
                    <td th:text="${activitySession.duration != null ? activitySession.duration : 'In progress'}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
