<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/styles/main.css}" rel="stylesheet"/>
    <link th:href="@{/styles/new-edit.css}" rel="stylesheet"/>
    <title>Time Tracker</title>
</head>
<body>
<div class="container">
    <h1>Time Tracker</h1>

    <form th:action="@{/activities}" th:object="${activity}" method="post">
        <label for="name">Activity Name</label>
        <input type="text" id="name" name="name" th:field="*{name}" placeholder="Activity name" required>

        <label for="description">Description</label>
        <input type="text" id="description" name="description" th:field="*{description}" placeholder="Description">

        <label for="category">Category</label>
        <input id="category" name="categoryName" list="categories" th:field="*{categoryName}"
               placeholder="Select or add category">
        <datalist id="categories">
            <option th:each="category : ${categories}" th:value="${category.name}" th:text="${category.name}"></option>
        </datalist>

        <label for="activityType">Type</label>
        <select id="activityType" name="activityType" th:field="*{activityType}">
            <option value="GOAL">Goal (Minimum Time)</option>
            <option value="MAX_TIME">Max Time (Limit)</option>
        </select>

        <button type="submit" class="green-btn">Add Activity</button>
    </form>
</div>
</body>
</html>
