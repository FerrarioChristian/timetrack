<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">TimeTrack</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#09090b', // zinc-950
                        card: '#09090b',
                        cardForeground: '#fafafa',
                        border: '#27272a', // zinc-800
                        primary: '#fafafa', // zinc-50
                        primaryForeground: '#18181b', // zinc-900
                        muted: '#27272a',
                        mutedForeground: '#a1a1aa', // zinc-400
                        accent: '#27272a',
                        accentForeground: '#fafafa',
                        destructive: '#7f1d1d',
                        destructiveForeground: '#fca5a5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.primary');
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="antialiased min-h-screen flex bg-background text-primary selection:bg-zinc-800 selection:text-white">

    <aside class="w-64 border-r border-border h-screen sticky top-0 flex-col hidden md:flex shrink-0">
            <div class="p-6 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20l9-5-9-5-9 5 9 5z"></path>
                <path d="M12 12l9-5-9-5-9 5 9 5z"></path>
                <path d="M12 12v8"></path>
            </svg>
            <h2 class="text-xl font-bold tracking-tight">TimeTrack</h2>
        </div>
        <nav class="flex-1 space-y-2 p-4">
            <a th:href="@{/}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-mutedForeground transition-all hover:text-foreground hover:bg-accent hover:text-accentForeground" th:classappend="${requestURI == '/'} ? 'bg-accent text-accentForeground font-medium' : ''">
                <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
                Dashboard
            </a>
            <a th:href="@{/activities}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-mutedForeground transition-all hover:text-foreground hover:bg-accent hover:text-accentForeground" th:classappend="${#strings.startsWith(requestURI, '/activities')} ? 'bg-accent text-accentForeground font-medium' : ''">
                <i data-lucide="list-todo" class="h-4 w-4"></i>
                Activities
            </a>
            <a th:href="@{/goals}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-mutedForeground transition-all hover:text-foreground hover:bg-accent hover:text-accentForeground" th:classappend="${#strings.startsWith(requestURI, '/goals')} ? 'bg-accent text-accentForeground font-medium' : ''">
                <i data-lucide="target" class="h-4 w-4"></i>
                Goals
            </a>
            <a th:href="@{/categories}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-mutedForeground transition-all hover:text-foreground hover:bg-accent hover:text-accentForeground" th:classappend="${#strings.startsWith(requestURI, '/categories')} ? 'bg-accent text-accentForeground font-medium' : ''">
                <i data-lucide="tags" class="h-4 w-4"></i>
                Categories
            </a>
        </nav>
        <div class="p-4 border-t border-border mt-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors hover:bg-destructive hover:text-destructiveForeground border border-border">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-h-screen min-w-0">
        <header class="md:hidden border-b border-border p-4 flex items-center justify-between sticky top-0 bg-background z-10">
            <h2 class="text-lg font-bold">Timetrack</h2>
            <div class="flex gap-4">
                <a th:href="@{/}" class="text-mutedForeground hover:text-primary"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></a>
                <a th:href="@{/activities}" class="text-mutedForeground hover:text-primary"><i data-lucide="list" class="w-5 h-5"></i></a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="text-mutedForeground hover:text-primary"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </form>
            </div>
        </header>
        
        <div class="p-6 md:p-10 w-full mx-auto max-w-[1400px]">
            <div th:replace="${content}"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
