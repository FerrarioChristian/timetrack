<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Error - Timetrack', ~{::div})}">
<body>
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
    <div class="bg-destructive/20 text-destructive rounded-full p-4 mb-6">
        <i data-lucide="alert-triangle" class="w-12 h-12"></i>
    </div>
    <h1 class="text-4xl font-bold tracking-tight mb-2">Oops! Something went wrong.</h1>
    <p class="text-mutedForeground text-lg mb-8" th:text="${message ?: 'We encountered an unexpected error.'}">An error occurred.</p>
    
    <div class="flex gap-4">
        <button onclick="window.history.back()" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-border bg-transparent hover:bg-accent hover:text-accentForeground h-10 px-4 py-2 gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Go Back
        </button>
        <a th:href="@{/}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-primary text-primaryForeground hover:bg-primary/90 h-10 px-4 py-2 gap-2">
            <i data-lucide="home" class="w-4 h-4"></i>
            Dashboard
        </a>
    </div>
</div>
</body>
</html>
