services:
  db:
    image: postgres:16-alpine
    container_name: timetrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-timetrackdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgre}
    volumes:
      - timetrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-timetrackdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - timetrack-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetrack-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5002}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-timetrackdb}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgre}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - timetrack-network

volumes:
  timetrack-pgdata:

networks:
  timetrack-network:
    driver: bridge
